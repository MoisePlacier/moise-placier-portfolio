      competence_id: initiative
    - id: mob_inserm_methodologie_autonomie
      competence_id: autonomie
    - id: mob_inserm_methodologie_methodologie_scientifique
      competence_id: methodologie_scientifique
    - id: mob_inserm_methodologie_documentation
      competence_id: documentation
    - id: mob_inserm_methodologie_reproductibilite
      competence_id: reproductibilite
  - id: inserm_dynamique
    description_factuelle: Adaptation d’un modèle dynamique latent en temps continu pour les trajectoires de créatinine.
    perimetre_ou_resultats: Travail de modélisation longitudinale utilisant des équations différentielles stochastiques, destiné à caractériser la récupération rénale; projet de publication potentiel.
    mobilisations:
    - id: mob_inserm_dynamique_modelisation_dynamique
      competence_id: modelisation_dynamique
    - id: mob_inserm_dynamique_donnees_longitudinales
      competence_id: donnees_longitudinales
    - id: mob_inserm_dynamique_r
      competence_id: r
    - id: mob_inserm_dynamique_recherche_clinique
      competence_id: recherche_clinique
