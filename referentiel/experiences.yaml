- id: exp_inserm_hug_2026
  organisation: INSERM UMRS 1155 CoRAKiD × Hôpitaux universitaires de Genève
  intitule_officiel: Stagiaire statisticien en recherche clinique
  lieu: Paris / Genève, travail largement à distance
  periode:
    debut: 2026-02
    fin: 2026-07
  periodes_presence_physique:
  - periode:
      debut: 2026-02
      fin: 2026-07
    lieu: Hôpital Tenon, Paris, France
  contexte: Recherche observationnelle en réanimation et modélisation de la récupération rénale après insuffisance rénale aiguë.
  effectif_analytique:
    valeur: 3350
    unite: patients
  type: stage
  secteurs:
  - sante_recherche
  - biostatistique
  realisations:
  - id: inserm_pipeline
    description_factuelle: 
      Conception et développement d'une chaîne de
      traitement reproductible pour l'intégration,
      l'harmonisation et la structuration de données
      hospitalières longitudinales en vue d'analyses
      de recherche clinique.
    perimetre_ou_resultats: >-
      Construction d'un entrepôt de données analytique
      à partir de 37 Go de données cliniques,
      biologiques, administratives et médicamenteuses
      issues du système d'information des HUG.
      Conversion et partitionnement
      des données au format Parquet, traitement et
      extraction en SQL avec DuckDB, puis exploitation
      des jeux analytiques sous R. Harmonisation des
      nomenclatures, unités et structures de données,
      contrôles de qualité.
      Constitution des cohortes selon les critères
      d'éligibilité et les fenêtres temporelles
      propres à chaque protocole. Paramétrage des
      règles d'extraction dans des fichiers YAML
      versionnés et documentation des variables utilisés,
      transformations et traitements.
    
    mobilisations:
      - id: mob_inserm_pipeline_etl
        competence_id: etl
        ressources:
          - ressource_id: architecture_donnees
            manifestations:
              - id: man_inserm_architecture
                description: >-
                  Conception d'un entrepôt analytique local avec DuckDB pour exploiter
                  environ 37 Go de données hospitalières provenant de systèmes hétérogènes
                  (données cliniques, administratives, laboratoire etc...).
          - ressource_id: sql
            manifestations:
              - id: man_inserm_sql
                description: >-
                  Développement de requêtes SQL pour les jointures, filtrages, conversions
                  et extractions temporelles afin de limiter les volumes importés dans R.
          - ressource_id: optimisation_traitements
            manifestations:
              - id: man_inserm_optimisation
                description: >-
                  Conversion des données au format Parquet et partitionnement déterministe
                  par patient pour optimiser les traitements et les extractions.
          - ressource_id: reproductibilite
            manifestations:
              - id: man_inserm_pipeline_reproductibilite
                description: >-
                  Externalisation des règles d'extraction et des fenêtres temporelles dans
                  des configurations YAML versionnées, associées à des scripts reproductibles.
      - id: mob_inserm_pipeline_qualite
        competence_id: qualite_donnees
        ressources:
          - ressource_id: harmonisation_donnees
            manifestations:
              - id: man_inserm_harmonisation
                description: >-
                  Construction de catalogues d'analytes et harmonisation des nomenclatures,
                  unités, structures longitudinales et classes médicamenteuses.
          - ressource_id: controle_qualite_donnees
            manifestations:
              - id: man_inserm_controle_qualite
                description: >-
                  Vérification des distributions, taux de valeurs manquantes et valeurs
                  extrêmes, avec discussion clinique des anomalies et des règles de plausibilité.
          - ressource_id: documentation_technique
            manifestations:
              - id: man_inserm_documentation
                description: >-
                  Production de dictionnaires documentant la provenance des variables, leurs
                  unités, les transformations appliquées et leurs rôles analytiques.
      - id: mob_inserm_pipeline_longitudinal
        competence_id: donnees_longitudinales
        ressources:
          - ressource_id: structuration_temporelle
            manifestations:
              - id: man_inserm_temporalite
                description: >-
                  Reconstruction des événements cliniques et alignement des observations sur
                  des origines temporelles communes, en conservant les horodatages et les
                  intervalles irréguliers entre mesures.
          - ressource_id: construction_cohortes
            manifestations:
              - id: man_inserm_cohortes
                description: >-
                  Application reproductible des critères d'éligibilité, d'exclusion, de
                  censure et des fenêtres d'observation pour constituer les populations
                  analytiques des différents projets.
  - id: inserm_inference

    titre: Analyse biostatistique du pronostic rénal en réanimation

    description_factuelle: >-
      Réalisation d'une analyse rétrospective
      sur une cohorte de patients en réanimation afin d'évaluer l'association
      entre les phénotypes du sédiment urinaire
      et le pronostic rénal à 30 jours après l'épisode
      d'insuffisance rénale aiguë.

    perimetre_ou_resultats: >-
      Analyse de 3 350 patients présentant une
      insuffisance rénale aiguë, avec classification
      du sédiment urinaire en quatre phénotypes
      et évaluation du critère composite MAKE30
      (décès, nouvelle épuration extrarénale ou
      dysfonction rénale persistante).
      Estimation des risques relatifs ajustés
      par régression de Poisson modifiée à variance
      robuste, après imputation multiple des
      covariables (15 jeux imputés).
      Réalisation d'analyses complémentaires par
      régression multinomiale, modèles linéaires
      et modèles de Fine-Gray à risques compétitifs,
      ainsi que d'analyses de sensibilité.
      Mise en évidence d'une association brute
      entre les anomalies du sédiment et MAKE30,
      non retrouvée après ajustement sur les
      caractéristiques des patients et la gravité
      clinique.
    mobilisations:
    - id: mob_inserm_inference_biostatistique
      competence_id: biostatistique
    - id: mob_inserm_inference_regression
      competence_id: regression
    - id: mob_inserm_inference_donnees_manquantes
      competence_id: donnees_manquantes
    - id: mob_inserm_inference_robustesse
      competence_id: evaluation_robustesse
    - id: mob_inserm_inference_recherche_clinique
      competence_id: recherche_clinique
    - id: mob_inserm_inference_r
      competence_id: r
  - id: inserm_methodologie
    description_factuelle: Conception et documentation de décisions méthodologiques pour une recherche reproductible.
    perimetre_ou_resultats: Propositions nouvelles concernant l’architecture analytique, la sélection des variables, la lisibilité, la robustesse et la réutilisation par l’équipe.
    mobilisations:
