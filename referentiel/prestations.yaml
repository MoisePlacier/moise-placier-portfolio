schema_version: 1.0.0
prestations:
  positionnement: Ingénieur agronome · Data science · Conseil indépendant
  titre_accueil: Ingénieur & Data Scientist indépendant
  accroche: >-
    J’accompagne les équipes de recherche, les acteurs agricoles et les entreprises
    dans l’analyse de données, la modélisation statistique et le développement
    d’outils scientifiques reproductibles.
  disponibilite: Disponible pour des missions de conseil, d’analyse et de développement, en France et à distance.
  appel_action:
    libelle: Discuter d’un projet
    objet_email: Échange autour d’un projet
  publics:
    - id: recrutement
      titre: Recrutement
      description: Découvrir le parcours, les expériences et les projets scientifiques.
      lien: /experiences/
      libelle_lien: Explorer le parcours
    - id: clients
      titre: Clients & partenaires
      description: Identifier une expertise et échanger autour d’une mission.
      lien: /prestations/
      libelle_lien: Découvrir les prestations
  page:
    surtitre: Conseil & prestations indépendantes
    titre: De la donnée brute à des résultats exploitables.
    introduction: >-
      Ingénieur agronome spécialisé en statistiques appliquées et data science,
      j'accompagne les équipes de recherche, les bureaux d'études et les entreprises
      dans l'analyse, la modélisation et la valorisation de leurs données.
    introduction_secondaire: >-
      À l'interface des sciences du vivant, de l'agronomie et de l'ingénierie des données,
      je développe des méthodes et des outils adaptés aux problématiques scientifiques et
      opérationnelles de chaque projet.
    expertises:
      - id: analyse-recherche
        titre: Statistiques & recherche appliquée
        resume: Des analyses rigoureuses, des méthodes explicites et des résultats interprétables.
        prestations:
          - Conception de plans d’expériences et de stratégies d’analyse statistique.
          - Modélisation statistique, biostatistiques et méthodes d’inférence.
          - Analyse de données expérimentales, biologiques et environnementales.
          - Production de rapports reproductibles, visualisation et valorisation de résultats scientifiques.
      - id: agronomie-environnement-spatial
        titre: Agronomie, environnement & données spatiales
        resume: Croiser les observations de terrain et les données géographiques pour comprendre les systèmes étudiés.
        prestations:
          - Analyse de données agronomiques et environnementales.
          - Traitement de données géographiques, séries temporelles et images satellites.
          - Statistiques spatiales, cartographie et caractérisation de la variabilité territoriale.
          - Développement d’indicateurs et d’outils d’aide à la décision pour l’agriculture et l’environnement.
      - id: procedes-industriels
        titre: Données industrielles & optimisation des procédés
        resume: Transformer les données de production et d’expérimentation en leviers d’amélioration.
        prestations:
          - Analyse de données de procédés, de production et de contrôle qualité.
          - Exploitation de données de capteurs, d’équipements et de suivi industriel.
          - Modélisation de procédés et identification de facteurs influençant les performances.
          - Conception d’outils de suivi, de prédiction et d’aide à la décision.
    ingenierie:
      titre: Ingénierie des données & développement d’outils
      resume: Des solutions légères, documentées et faciles à reprendre.
      texte: >-
        Selon les besoins, ces interventions peuvent inclure le développement de scripts et de
        pipelines de données, l’automatisation de traitements, la création d’applications légères
        ou de tableaux de bord, ainsi que la production de rapports reproductibles avec R, Python
        et Quarto.
      texte_secondaire: >-
        Je privilégie des solutions proportionnées aux besoins, utilisant autant que possible les
        données, les logiciels et les infrastructures déjà disponibles.
    modalites:
      titre: Modalités de collaboration
      texte: >-
        J'interviens directement auprès des équipes scientifiques et techniques, mais également en
        renfort de bureaux d'études, de cabinets de conseil et de consultants indépendants.
      texte_secondaire: >-
        Les missions peuvent aller d'une analyse ponctuelle à un projet de plusieurs semaines, à
        distance ou sur site. Chaque collaboration débute par un échange pour préciser les objectifs,
        les données disponibles, les livrables et les modalités d'intervention.
      conclusion: Un projet, un besoin ponctuel ou une expertise complémentaire à mobiliser ?
  pied_de_page: Ingénieur & Data Scientist indépendant
