questions:
- id: Q01
  objet: Attribution individuelle
  question: 'Pour les projets Populus, ProteinNet et Sentinel-2 : préciser les composants ou analyses développés, testés et rédigés personnellement, afin d’associer chaque réalisation à une contribution technique exacte. La contribution principale (initiation des sujets, grande partie du code, rédaction des rapports) est déclarée par le candidat dans S12.'
